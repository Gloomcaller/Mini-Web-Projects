<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="media/favicon32.png">
    <link rel="stylesheet" href="styles.css">
    <title>Caesar Cipher</title>
</head>

<body>
    <div class="container">
        <h1>Caesar Cipher</h1>

        <!-- Shift -->
        <div class="input-group">
            <label for="shift">Shift (1–25)</label>
            <input type="number" id="shift" min="1" max="25" value="3" placeholder="Shift">
        </div>

        <!-- Message -->
        <div class="input-group">
            <label for="message">Your message</label>
            <textarea id="message" placeholder="Type or paste your text here..." rows="3"></textarea>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button id="encrypt-btn">Encrypt</button>
            <button id="decrypt-btn">Decrypt</button>
        </div>

        <!-- Display -->
        <div id="output-area" class="hidden">
            <div class="output-card">
                <span class="output-label">Input</span>
                <div class="output-text" id="input-display"></div>
            </div>
            <div class="output-card">
                <span class="output-label">Output</span>
                <div class="output-text" id="output-display"></div>
                <button id="copy-btn" class="copy-btn">Copy</button>
            </div>
        </div>

        <!-- Error -->
        <p id="error-message"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
